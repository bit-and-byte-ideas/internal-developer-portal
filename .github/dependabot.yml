# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
      - backstage
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      backstage:
        patterns:
          - '@backstage/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript'
      testing:
        patterns:
          - '@testing-library/*'
          - 'jest'
          - '@jest/*'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'docker'
    ignore:
      # Node's odd-numbered releases (23, 25, ...) never reach LTS and go
      # EOL ~6 months after release. Bumping to one is a dead end and needs
      # to be evaluated by hand once the next even (LTS) release is ready
      # (see #51, #41 / 87114cc for past attempts that had to be reverted).
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'github-actions'
